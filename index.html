<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANIC TERRIER — Huddersfield Town AFC 8-Bit Tribute</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="spectrum-chassis">
    <header class="chassis-header">
      <div class="brand-left">
        <span class="sinclair-badge">HTAFC 48K</span>
        <span class="title-label">MANIC TERRIER</span>
      </div>
      <div class="spectrum-stripes" aria-hidden="true">
        <span class="stripe s-blue"></span>
        <span class="stripe s-white"></span>
        <span class="stripe s-cyan"></span>
        <span class="stripe s-yellow"></span>
        <span class="stripe s-magenta"></span>
      </div>
    </header>

    <main class="screen-bezel" id="screen-bezel">
      <div class="crt-frame" id="crt-frame">
        <canvas id="game-canvas" width="256" height="208" tabindex="0" aria-label="Manic Terrier 8-bit game screen"></canvas>
        <div class="scanlines" id="scanlines" aria-hidden="true"></div>
      </div>
    </main>

    <section class="retro-controls" aria-label="Game controls">
      <div class="touch-pad">
        <button class="spec-key key-move" id="btn-left" type="button" aria-label="Move Left">◄ LEFT</button>
        <button class="spec-key key-move" id="btn-right" type="button" aria-label="Move Right">RIGHT ►</button>
        <button class="spec-key key-jump" id="btn-jump" type="button" aria-label="Jump or Start">▲ JUMP / START</button>
      </div>
      <div class="utility-keys">
        <button class="spec-key key-util" id="btn-mute" type="button" title="Toggle Chiptune Audio (M)">♪ SOUND: ON</button>
        <button class="spec-key key-util" id="btn-pause" type="button" title="Pause Game (P)">PAUSE</button>
        <button class="spec-key key-util" id="btn-restart" type="button" title="Restart Cavern (R)">RESTART</button>
        <button class="spec-key key-util" id="btn-crt" type="button" title="Toggle CRT Scanlines">CRT: ON</button>
      </div>
    </section>

    <footer class="controls-legend">
      <span><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> RUN</span>
      <span><kbd>↑</kbd> / <kbd>W</kbd> / <kbd>SPACE</kbd> JUMP</span>
      <span><kbd>M</kbd> MUTE</span>
      <span><kbd>P</kbd> PAUSE</span>
      <span><kbd>R</kbd> RESTART</span>
      <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> CAVERN SELECT (TITLE)</span>
    </footer>
  </div>

  <script src="js/constants.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
